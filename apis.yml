aid: david-energy
name: David Energy
description: David Energy is a clean-energy technology company and licensed electricity retailer that
  installs free plug-in smart batteries for homes and businesses. Its software charges batteries when
  grid power is cheap and discharges them during peak-price periods to lower customers' monthly utility
  bills, alongside bill-monitoring and thermostat-management advisory tools. Backed by Union Square
  Ventures, David Energy operates in the New York City market with a stated mission of powering the grid
  on 100% clean energy and shifting the balance of energy control from institutions toward consumers.
